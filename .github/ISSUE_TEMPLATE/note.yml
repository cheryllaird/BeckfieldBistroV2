name: Quick note
description: A rough idea, todo or bug hunch. The scope-notes agent turns it into a scoped issue or a fix PR.
title: "Note: "
labels: ["triage:inbox"]
body:
  - type: textarea
    id: note
    attributes:
      label: Note
      description: As rough as you like. A sentence or two is fine.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Not sure
        - Idea / feature
        - Bug
        - Chore
      default: 0
    validations:
      required: false
